# 知彼 Vantage 稳定入口 · nginx 站点（P0 r2 蓝绿）
# 部署目标：/etc/nginx/conf.d/zhibi.conf
# 3002 端口从此由 nginx 持有，不再由 docker-proxy 直接暴露——部署期间入口不中断。
# upstream 定义在 /etc/nginx/conf.d/zhibi-upstream.conf（切换槽位时只重写该文件 + reload）。
server {
    listen 3002;
    listen [::]:3002;
    server_name _;

    client_max_body_size 20m;

    # 维护开关：文件存在即返回明确 503（仅用于后端替换的数秒窗口，不用于前端）
    # 明确 503 + 维护页，不是随机 502、不是连接拒绝。
    location / {
        if (-f /etc/nginx/zhibi_maintenance) {
            return 503;
        }

        proxy_pass http://zhibi_web_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE（/api/stream）必须不缓冲、长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 上游异常（后端替换瞬间）不得外泄 502：统一转成明确 503 + Retry-After
        proxy_intercept_errors on;
        error_page 502 504 = @degraded;
    }


    # 静态资源跨 release 回退：切换后新 release 里不存在旧页面引用的 chunk，
    # 若直接 404，用户已打开的旧页面懒加载会失败（"旧 HTML 引用已删 chunk" 的另一半问题）。
    # 先问当前槽，404 时回退到上一槽（排空期内仍存活）；回退也失败则如实返回 404，
    # 绝不返回 502。内容哈希文件名因此可以安全地长期 immutable 缓存。
    location /_next/static/ {
        if (-f /etc/nginx/zhibi_maintenance) {
            return 503;
        }

        proxy_pass http://zhibi_web_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_intercept_errors on;
        error_page 404 = @static_previous;
    }

    location @static_previous {
        proxy_pass http://zhibi_web_previous;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_intercept_errors on;
        error_page 502 503 504 = @static_missing;
    }

    location @static_missing {
        return 404;
    }

    # API / 健康检查：rewrite 代理响应不一定带 Cache-Control（middleware 对代理响应不生效），
    # 在入口显式声明不可共享缓存，避免共享缓存按启发式缓存 GET 响应。
    # 正则 location 优先于上面的前缀 location。
    location ~ ^/(api/|healthz$|metrics$) {
        if (-f /etc/nginx/zhibi_maintenance) {
            return 503;
        }

        proxy_pass http://zhibi_web_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        add_header Cache-Control "no-store, max-age=0" always;

        proxy_intercept_errors on;
        error_page 502 504 = @degraded;
    }

    # 上游不可用时的统一降级：明确 503（浏览器会自动重试语义清晰），绝不 502
    location @degraded {
        add_header Retry-After 3 always;
        add_header Cache-Control "no-store, max-age=0" always;
        return 503;
    }

    error_page 503 /zhibi-maintenance.html;
    location = /zhibi-maintenance.html {
        root /etc/nginx;
        internal;
    }
}
