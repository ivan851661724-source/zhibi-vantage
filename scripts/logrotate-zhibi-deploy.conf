# /etc/logrotate.d/zhibi-deploy（服务器侧安装：cp scripts/logrotate-zhibi-deploy.conf /etc/logrotate.d/zhibi-deploy）
# cron 每分钟向 /var/log/zhibi-deploy.log 追加一行例行结果（暂停/无需部署也各占一行，
# 约 1400 行/天），无轮转会无限增长。copytruncate：cron 以 >> 追加打开，无需通知进程。
/var/log/zhibi-deploy.log {
    weekly
    rotate 8
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
